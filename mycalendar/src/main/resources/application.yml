server:
  port: 8082

logging:
  level:
    root: info

spring:
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  profiles:
    active: local
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[default_schema]": admin
        "[dialect]": org.hibernate.dialect.OracleDialect
  thymeleaf:
    cache: false

mycalendar:
  github-sync:
    enabled: ${MYCALENDAR_GITHUB_SYNC_ENABLED:false}
    token: ${MIKE_GITHUB_TOKEN:}
    owner: gonyda
    repo: mike
    branch: main
    path: calendar/mycalendar.json
    commit-message: "chore(calendar): sync mycalendar events"
