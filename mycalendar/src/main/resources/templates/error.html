<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>오류 - 커플 캘린더</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon"/>
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}"/>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
    </style>
</head>
<body>
    <main class="error-container">
        <div class="error-icon" aria-hidden="true">⚠️</div>
        <h1 class="error-title">오류가 발생했습니다</h1>
        <p class="error-message" th:text="${errorMessage}">요청을 처리하는 중 오류가 발생했습니다.</p>
        <a href="/" class="home-link">홈으로 돌아가기</a>
    </main>
</body>
</html>
