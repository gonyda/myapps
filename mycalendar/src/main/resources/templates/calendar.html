<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="|${year}년 ${month}월 캘린더|">캘린더</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon"/>
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}"/>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <main class="container"
          data-swipe-container
          th:attr="data-prev-url=@{/calendar/{y}/{m}(y=${prevYear}, m=${prevMonth})},
                   data-next-url=@{/calendar/{y}/{m}(y=${nextYear}, m=${nextMonth})}">

        <!-- D-Day Counter -->
        <section class="dday-counter" aria-label="D-Day 카운터">
            <span th:text="|D+${dDay}|">D+100</span>
        </section>

        <!-- Calendar Header: Navigation + Title -->
        <header class="calendar-header">
            <a class="nav-btn" th:href="@{/calendar/{y}/{m}(y=${prevYear}, m=${prevMonth})}" aria-label="이전 월">&laquo; 이전</a>
            <h1 class="calendar-title" th:text="|${year}년 ${month}월|">2026년 7월</h1>
            <a class="nav-btn" th:href="@{/calendar/{y}/{m}(y=${nextYear}, m=${nextMonth})}" aria-label="다음 월">다음 &raquo;</a>
        </header>

        <!-- Actions (removed: full-page navigation link) -->

        <!-- Calendar Grid -->
        <section class="calendar-grid" aria-label="월별 캘린더">
            <!-- Day of week headers (일~토) -->
            <div class="day-header">일</div>
            <div class="day-header">월</div>
            <div class="day-header">화</div>
            <div class="day-header">수</div>
            <div class="day-header">목</div>
            <div class="day-header">금</div>
            <div class="day-header">토</div>

            <!-- Empty cells before first day of month -->
            <th:block th:with="firstDayOfWeek=${T(java.time.LocalDate).of(year, month, 1).getDayOfWeek().getValue() % 7}">
                <div class="day-cell empty" th:each="i : ${#numbers.sequence(1, firstDayOfWeek)}" th:if="${firstDayOfWeek > 0}"></div>
            </th:block>

            <!-- Day cells -->
            <th:block th:with="daysInMonth=${T(java.time.YearMonth).of(year, month).lengthOfMonth()}">
                <div th:each="day : ${#numbers.sequence(1, daysInMonth)}"
                     th:with="currentDate=${T(java.time.LocalDate).of(year, month, day)}, daySchedules=${calendarHelper.getSchedulesForDate(schedules, T(java.time.LocalDate).of(year, month, day))}"
                     th:class="${'day-cell' + (currentDate.equals(today) ? ' today' : '')}"
                     th:attr="data-date=${currentDate}"
                     onclick="openScheduleModal(this.dataset.date)">

                    <!-- Day number -->
                    <div class="day-number" th:text="${day}">1</div>

                    <!-- Anniversary markers for this date -->
                    <th:block th:each="anniversary : ${anniversaries}">
                        <div class="anniversary-marker"
                             th:if="${anniversary.date().equals(currentDate)}"
                             th:text="${anniversary.name()}">100일</div>
                    </th:block>

                    <!-- Schedules for this date (max 5: first 3 always visible, 4th-5th desktop only) -->
                    <th:block th:each="schedule, iterStat : ${daySchedules}" th:if="${iterStat.index < 5}">
                        <a th:class="${'schedule-item category-' + schedule.category().name().toLowerCase() + (iterStat.index >= 3 ? ' desktop-schedule' : '')}"
                           href="javascript:void(0)"
                           th:attr="data-schedule-id=${schedule.id()}"
                           th:text="${schedule.content()}"
                           th:title="${schedule.content()}"
                           onclick="openScheduleDetailModal(event, this.dataset.scheduleId)">일정</a>
                    </th:block>

                    <!-- Mobile overflow: show when total > 3 (hidden on desktop) -->
                    <div class="schedule-overflow-mobile"
                         th:if="${daySchedules.size() > 3}"
                         th:text="${'+' + (daySchedules.size() - 3)}">+2</div>

                    <!-- Desktop overflow: show when total > 5 (hidden on mobile) -->
                    <div class="schedule-overflow-desktop"
                         th:if="${daySchedules.size() > 5}"
                         th:text="${'+' + (daySchedules.size() - 5)}">+2</div>
                </div>
            </th:block>
        </section>
    </main>

    <!-- Schedule Modal (등록/상세/수정 겸용) -->
    <div id="schedule-modal" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-container">
            <button type="button" class="modal-close" onclick="closeScheduleModal(event)" aria-label="닫기">&times;</button>
            <h2 id="modal-title" class="modal-title">일정 등록</h2>
            <form id="schedule-form" action="/schedules" method="post" class="modal-form">
                <input type="hidden" id="modal-method" name="_method" value="" disabled/>
                <div class="form-group">
                    <label for="modal-category">카테고리</label>
                    <select id="modal-category" name="category" required>
                        <option value="">-- 선택 --</option>
                        <option value="SEUNGKWON">승권</option>
                        <option value="CHIWON">치원</option>
                        <option value="DATE">데이트</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modal-startDate">시작일</label>
                    <input type="date" id="modal-startDate" name="startDate" required/>
                </div>
                <div class="form-group">
                    <label for="modal-endDate">종료일 (선택)</label>
                    <input type="date" id="modal-endDate" name="endDate"/>
                </div>
                <div class="form-group">
                    <label for="modal-scheduleTime">시간 (선택)</label>
                    <input type="time" id="modal-scheduleTime" name="scheduleTime"/>
                </div>
                <div class="form-group">
                    <label for="modal-content">내용</label>
                    <textarea id="modal-content" name="content" maxlength="200" required
                              placeholder="일정 내용을 입력하세요 (최대 200자)"></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" id="modal-submit-btn" class="btn btn-primary">등록</button>
                    <button type="button" id="modal-delete-btn" class="btn btn-delete" style="display:none;"
                            onclick="deleteSchedule()">삭제</button>
                    <button type="button" class="btn btn-secondary" onclick="closeScheduleModal(event)">취소</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal JavaScript -->
    <script>
        var currentScheduleId = null;

        function openScheduleModal(date) {
            resetModal();
            document.getElementById('modal-startDate').value = date;
            document.getElementById('schedule-modal').classList.add('active');
        }

        function openScheduleDetailModal(event, scheduleId) {
            event.stopPropagation();
            resetModal();
            currentScheduleId = scheduleId;

            fetch('/schedules/' + scheduleId)
                .then(function(response) { return response.json(); })
                .then(function(schedule) {
                    document.getElementById('modal-title').textContent = '일정 상세';
                    document.getElementById('modal-submit-btn').textContent = '수정';
                    document.getElementById('modal-delete-btn').style.display = '';

                    var form = document.getElementById('schedule-form');
                    form.action = '/schedules/' + scheduleId;

                    var methodInput = document.getElementById('modal-method');
                    methodInput.value = 'PUT';
                    methodInput.disabled = false;

                    document.getElementById('modal-category').value = schedule.category;
                    document.getElementById('modal-startDate').value = schedule.startDate || '';
                    document.getElementById('modal-endDate').value = schedule.endDate || '';
                    document.getElementById('modal-scheduleTime').value = schedule.scheduleTime || '';
                    document.getElementById('modal-content').value = schedule.content || '';

                    document.getElementById('schedule-modal').classList.add('active');
                });
        }

        function resetModal() {
            currentScheduleId = null;
            document.getElementById('modal-title').textContent = '일정 등록';
            document.getElementById('modal-submit-btn').textContent = '등록';
            document.getElementById('modal-delete-btn').style.display = 'none';

            var form = document.getElementById('schedule-form');
            form.action = '/schedules';
            form.reset();

            var methodInput = document.getElementById('modal-method');
            methodInput.value = '';
            methodInput.disabled = true;
        }

        function deleteSchedule() {
            if (!currentScheduleId) return;
            if (!confirm('이 일정을 삭제하시겠습니까?')) return;

            var form = document.createElement('form');
            form.method = 'post';
            form.action = '/schedules/' + currentScheduleId;

            var methodInput = document.createElement('input');
            methodInput.type = 'hidden';
            methodInput.name = '_method';
            methodInput.value = 'DELETE';
            form.appendChild(methodInput);

            document.body.appendChild(form);
            form.submit();
        }

        function closeScheduleModal(event) {
            event.stopPropagation();
            document.getElementById('schedule-modal').classList.remove('active');
        }

        function handleOverlayClick(event) {
            if (event.target === document.getElementById('schedule-modal')) {
                document.getElementById('schedule-modal').classList.remove('active');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            var scheduleLinks = document.querySelectorAll('.schedule-item');
            for (var i = 0; i < scheduleLinks.length; i++) {
                scheduleLinks[i].addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            }
        });
    </script>

    <!-- Hammer.js for swipe gestures -->
    <script src="https://hammerjs.github.io/dist/hammer.min.js"></script>
    <script th:src="@{/js/swipe.js}"></script>
</body>
</html>
