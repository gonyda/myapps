<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>일정 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon"/>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <main class="container">

        <h1>일정 상세</h1>

        <section class="schedule-info">
            <dl>
                <dt>카테고리</dt>
                <dd>
                    <span th:if="${schedule.category().name() == 'SEUNGKWON'}">승권</span>
                    <span th:if="${schedule.category().name() == 'CHIWON'}">치원</span>
                    <span th:if="${schedule.category().name() == 'DATE'}">데이트</span>
                </dd>

                <dt>시작일</dt>
                <dd th:text="${schedule.startDate()}"></dd>

                <th:block th:if="${schedule.endDate() != null}">
                    <dt>종료일</dt>
                    <dd th:text="${schedule.endDate()}"></dd>
                </th:block>

                <th:block th:if="${schedule.scheduleTime() != null}">
                    <dt>시간</dt>
                    <dd th:text="${schedule.scheduleTime()}"></dd>
                </th:block>

                <dt>내용</dt>
                <dd th:text="${schedule.content()}"></dd>
            </dl>
            <div class="timestamps">
                <span>생성: <span th:text="${#temporals.format(schedule.createdAt(), 'yyyy-MM-dd HH:mm')}"></span></span>
                <span th:if="${schedule.updatedAt() != null}">
                    | 수정: <span th:text="${#temporals.format(schedule.updatedAt(), 'yyyy-MM-dd HH:mm')}"></span>
                </span>
            </div>
        </section>

        <div class="actions">
            <a class="btn-edit" th:href="@{/schedules/{id}/edit(id=${schedule.id()})}">수정</a>
            <form th:action="@{/schedules/{id}(id=${schedule.id()})}" method="post"
                  onsubmit="return confirm('이 일정을 삭제하시겠습니까?');">
                <input type="hidden" name="_method" value="DELETE"/>
                <button type="submit" class="btn-delete">삭제</button>
            </form>
            <a class="btn-back"
               th:href="@{/calendar/{year}/{month}(year=${schedule.startDate().getYear()}, month=${schedule.startDate().getMonthValue()})}">목록으로</a>
        </div>

    </main>
</body>
</html>
