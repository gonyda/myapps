spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        "[default_schema]":

logging:
  level:
    root: warn

myshare:
  github:
    enabled: false
    token: ""
    owner: gonyda
    repo: mike
    branch: main
    base-path: share
  cache:
    ttl-seconds: 20
    max-entries: 200
  mini-app:
    pin: test-mini-pin
    max-payload-bytes: 1048576
    github:
      enabled: false
      base-path: mini
      commit-message-prefix: "chore(mini): sync"
