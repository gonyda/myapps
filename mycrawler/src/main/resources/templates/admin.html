<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>mycrawler Admin</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f5f5f5;">

<h1 style="color: #333; border-bottom: 2px solid #007bff; padding-bottom: 10px;">mycrawler 대시보드</h1>

<!-- Flash Messages -->
<div th:if="${warningMessage}" style="background-color: #fff3cd; border: 1px solid #ffc107; color: #856404; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px;">
    <span th:text="${warningMessage}">경고 메시지</span>
</div>
<div th:if="${successMessage}" style="background-color: #d4edda; border: 1px solid #28a745; color: #155724; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px;">
    <span th:text="${successMessage}">성공 메시지</span>
</div>

<!-- Running Status -->
<div th:if="${isRunning}" style="background-color: #cce5ff; border: 1px solid #007bff; color: #004085; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px;">
    현재 크롤링이 진행 중입니다
</div>

<!-- Scheduler Status Section -->
<div style="background-color: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 20px; margin-bottom: 20px;">
    <h2 style="margin-top: 0; color: #555; font-size: 1.2em;">스케줄러 상태</h2>
    <table style="border-collapse: collapse; width: 100%;">
        <tr>
            <td style="padding: 8px 12px; font-weight: bold; width: 160px;">상태</td>
            <td style="padding: 8px 12px;">
                <span th:if="${schedulerEnabled}" style="color: #28a745; font-weight: bold;">활성</span>
                <span th:unless="${schedulerEnabled}" style="color: #dc3545; font-weight: bold;">비활성</span>
            </td>
        </tr>
        <tr>
            <td style="padding: 8px 12px; font-weight: bold;">Cron 표현식</td>
            <td style="padding: 8px 12px; font-family: monospace;" th:text="${cronExpression} ?: '(미설정)'">cron</td>
        </tr>
        <tr>
            <td style="padding: 8px 12px; font-weight: bold;">다음 실행 예정</td>
            <td style="padding: 8px 12px;" th:text="${nextExecutionTime} ?: '(없음)'">next</td>
        </tr>
    </table>
</div>

<!-- Manual Execution Section -->
<div style="background-color: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 20px; margin-bottom: 20px;">
    <h2 style="margin-top: 0; color: #555; font-size: 1.2em;">수동 실행</h2>
    <form th:action="@{/admin/crawl}" method="post">
        <button type="submit"
                th:disabled="${isRunning}"
                style="background-color: #007bff; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; font-size: 1em; cursor: pointer;">
            크롤링 실행
        </button>
    </form>
</div>

<!-- Recent Results Section -->
<div style="background-color: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 20px;">
    <h2 style="margin-top: 0; color: #555; font-size: 1.2em;">최근 실행 결과</h2>

    <p th:if="${#lists.isEmpty(results)}" style="color: #888;">실행 결과가 없습니다.</p>

    <table th:unless="${#lists.isEmpty(results)}" style="border-collapse: collapse; width: 100%; font-size: 0.9em;">
        <thead>
        <tr style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6;">
            <th style="padding: 10px 8px; text-align: left;">대상</th>
            <th style="padding: 10px 8px; text-align: left;">상태</th>
            <th style="padding: 10px 8px; text-align: left;">트리거</th>
            <th style="padding: 10px 8px; text-align: right;">소요 시간</th>
            <th style="padding: 10px 8px; text-align: left;">시작 시각</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="result : ${results}" style="border-bottom: 1px solid #eee;">
            <td style="padding: 8px;" th:text="${result.targetName()}">target</td>
            <td style="padding: 8px;">
                <span th:if="${result.status().name() == 'SUCCESS'}" style="color: #28a745; font-weight: bold;">성공</span>
                <span th:if="${result.status().name() == 'FAILURE'}" style="color: #dc3545; font-weight: bold;">실패</span>
            </td>
            <td style="padding: 8px;">
                <span th:if="${result.triggerSource() != null and result.triggerSource().name() == 'SCHEDULED'}">스케줄러</span>
                <span th:if="${result.triggerSource() != null and result.triggerSource().name() == 'MANUAL'}">수동</span>
                <span th:if="${result.triggerSource() == null}">-</span>
            </td>
            <td style="padding: 8px; text-align: right; font-family: monospace;" th:text="${result.durationMillis() + 'ms'}">0ms</td>
            <td style="padding: 8px;" th:text="${result.startTime()}">time</td>
        </tr>
        </tbody>
    </table>

    <!-- Result Details (content/error) -->
    <div th:unless="${#lists.isEmpty(results)}" th:each="result : ${results}" style="margin-top: 12px; padding: 12px; background-color: #f8f9fa; border: 1px solid #eee; border-radius: 4px;">
        <strong th:text="${result.targetName()}">target</strong>
        <span th:if="${result.status().name() == 'FAILURE'}" style="color: #dc3545;">
            — 오류: <span th:text="${result.errorMessage()}">error</span>
        </span>
        <div th:if="${result.contentSummary(contentMaxLength) != null}" style="margin-top: 8px;">
            <pre style="white-space: pre-wrap; word-break: break-all; background-color: #fff; border: 1px solid #ddd; padding: 8px; border-radius: 4px; max-height: 200px; overflow-y: auto; font-size: 0.85em;" th:text="${result.contentSummary(contentMaxLength)}">content</pre>
        </div>
    </div>
</div>

</body>
</html>
