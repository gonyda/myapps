<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>오류 발생</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 40px; background-color: #f8f9fa; color: #333;">
    <div style="max-width: 600px; margin: 80px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 40px; text-align: center;">
        <h1 style="color: #dc3545; font-size: 24px; margin-bottom: 16px;">오류가 발생했습니다</h1>
        <p th:text="${errorMessage}" style="color: #666; font-size: 16px; line-height: 1.6; margin-bottom: 24px;">알 수 없는 오류가 발생했습니다.</p>
        <a href="/admin" style="display: inline-block; padding: 10px 24px; background-color: #007bff; color: #fff; text-decoration: none; border-radius: 4px; font-size: 14px;">대시보드로 돌아가기</a>
    </div>
</body>
</html>
