server:
  port: 8083

logging:
  level:
    root: info

spring:
  profiles:
    active: local
  datasource:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        "[dialect]": org.hibernate.dialect.H2Dialect
  thymeleaf:
    cache: false
