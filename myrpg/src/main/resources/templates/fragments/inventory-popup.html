<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 인벤토리 팝업 전체 오버레이 -->
<div class="overlay inventory-overlay" id="inventoryOverlay" th:fragment="inventory-popup">
    <div class="panel">
        <header class="panel-header">
            <h3>인벤토리</h3>
            <div class="inventory-sort-controls">
                <button class="sort-btn active" data-sort="default" onclick="sortInventory('default')">획득순</button>
                <button class="sort-btn" data-sort="name" onclick="sortInventory('name')">이름순</button>
                <button class="sort-btn" data-sort="type" onclick="sortInventory('type')">타입순</button>
            </div>
            <button class="panel-close" onclick="closeInventory()" aria-label="닫기">✕</button>
        </header>
        <div class="panel-body" id="inventoryContent">
            <div id="inventoryListArea"></div>
        </div>
    </div>
</div>

<!-- 인벤토리 목록 내용 (fetch로 교체되는 영역) -->
<div th:fragment="inventory-content">
    <div class="inventory-list" id="inventoryList" th:if="${inventory != null and !inventory.items.isEmpty()}">
        <div class="inventory-item" th:each="item : ${inventory.items}"
             th:attr="data-owned-id=${item.ownedItemId},data-name=${item.name},data-type=${item.type.name()}"
             th:data-detail="${#strings.listJoin(item.detailLines, '||')}">
            <div class="item-info">
                <span class="item-name" th:text="${item.name}">아이템명</span>
                <span class="equipped-badge" th:if="${item.equipped}">[장착중]</span>
                <button class="item-detail-btn" onclick="openItemDetail(this.parentElement.parentElement)"
                        aria-label="상세보기">🔍</button>
            </div>
            <div class="item-meta">
                <span class="item-type" th:text="${item.typeLabel}">타입</span>
                <span class="item-quantity" th:if="${item.quantity > 1}" th:text="'×' + ${item.quantity}">×1</span>
                <span class="item-durability" th:if="${item.currentDurability != null}"
                      th:text="'내구도 ' + ${#numbers.formatDecimal(item.currentDurability, 1, 1)} + '/' + ${item.maxDurability}">
                </span>
            </div>
            <div class="item-actions">
                <button th:if="${item.usable}" class="item-action-btn use-btn"
                        th:attr="data-id=${item.ownedItemId}"
                        onclick="usePotion(this.dataset.id)">사용</button>
                <button th:if="${item.equippable and !item.equipped}" class="item-action-btn equip-btn"
                        th:attr="data-id=${item.ownedItemId}"
                        onclick="equipItem(this.dataset.id)">착용</button>
                <button th:if="${item.equippable and item.equipped}" class="item-action-btn unequip-btn"
                        th:attr="data-id=${item.ownedItemId}"
                        onclick="unequipItem(this.dataset.id)">해제</button>
            </div>
        </div>
    </div>
    <div class="inventory-empty" th:if="${inventory == null or inventory.items.isEmpty()}">
        <p>보유 아이템이 없습니다</p>
    </div>
    <div class="inventory-footer" th:if="${inventory != null}">
        <span class="gold-display">💰 보유 골드: <strong th:text="${inventory.gold}">0</strong></span>
    </div>
</div>
</body>
</html>
