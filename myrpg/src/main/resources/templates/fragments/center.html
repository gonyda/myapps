<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="center" th:fragment="center">
    <!-- 상황 멘트 -->
    <div class="situation" id="situation" th:text="${view.ambience}">
        맵 데이터를 불러오는 중...
    </div>

    <!-- 대화 영역: 항상 표시, 상태에 따라 NPC(초록)/몬스터(빨강)/빈(회색) -->
    <div class="npc-talk" id="npcTalk"
         th:classappend="${view.npcName != null} ? ' active-npc' : (${view.monsterName != null} ? ' active-monster' : '')">

        <!-- NPC 대사 (NPC 클릭 시) -->
        <th:block th:if="${view.npcName != null}">
            <span class="npc-name" th:text="${view.npcName}"></span>
            <p th:text="${view.npcDialogue}"></p>
            <div class="npc-actions" id="npcActions"
                 th:if="${view.npcActions != null and !view.npcActions.isEmpty()}">
                <button th:each="action : ${view.npcActions}"
                        th:text="${action.label}"
                        th:attr="onclick='npcAction(\'' + ${action.label} + '\', \'' + ${talkingNpcId} + '\')'">
                </button>
            </div>
        </th:block>

        <!-- 몬스터 대사 (몬스터 클릭 시) -->
        <th:block th:if="${view.monsterName != null}">
            <span class="monster-name" th:text="${view.monsterName}">몬스터</span>
            <span class="monster-meta" th:text="'Lv.' + ${view.monsterLevel} + ' · HP ' + ${view.monsterMaxHp}">Lv.1 · HP 25</span>
            <p th:text="${view.monsterDialogue}">대사</p>
            <div class="monster-actions">
                <button th:each="action : ${view.monsterActions}"
                        th:text="${action.label()}"
                        th:attr="onclick='startBattle(\'' + ${encounteredMonsterId} + '\')'"
                        class="monster-action-btn">전투</button>
            </div>
        </th:block>
    </div>

    <!-- 상호작용 버튼 -->
    <div class="interactions" id="interactions">
        <th:block th:if="${view.interactions != null}">
            <button th:each="item : ${view.interactions}"
                    th:classappend="${item.npc} ? 'npc' : ''"
                    th:text="${item.name}"
                    th:attr="data-npc-id=${item.npc ? item.id : null},
                             data-monster-id=${item.npc ? null : item.id}"
                    onclick="onInteractionClick(this)">
            </button>
        </th:block>
    </div>

    <!-- 미니맵 -->
    <div th:replace="~{fragments/minimap :: minimap}"></div>
</section>
</body>
</html>
