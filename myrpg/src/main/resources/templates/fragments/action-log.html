<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<footer class="action-log" id="actionLog" th:fragment="action-log">
    <div th:each="entry : ${view.logs}" class="log-line" th:classappend="'line-' + ${entry.type}">
        <span class="log-time" th:text="${entry.timestamp}">00:00:00</span>
        <span class="log-badge" th:classappend="'badge-' + ${entry.type}"
              th:text="${entry.type == 'combat' ? '전투' : (entry.type == 'growth' ? '성장' : (entry.type == 'item' ? '획득' : (entry.type == 'dungeon' ? '던전' : '알림')))}">알림</span>
        <span th:class="'log-msg log-' + ${entry.type}" th:text="${entry.message}">로그 본문</span>
    </div>
</footer>
</body>
</html>
