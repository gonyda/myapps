<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 공용 전투 화면 본문(DRY): battle-view / battle-response 양쪽에서 재사용 -->
<div th:fragment="battle-center">
    <!-- 몬스터 정보 -->
    <div class="battle-monster-info">
        <span class="monster-name" th:text="${battleView.monsterName}">몬스터</span>
        <span class="monster-level" th:text="'Lv.' + ${battleView.monsterLevel}">Lv.1</span>
    </div>

    <!-- 몬스터 HP 바 (기존 .bar 컴포넌트 패턴 재사용) -->
    <div class="battle-hp-wrap">
        <span class="label">HP</span>
        <div class="bar monster-hp">
            <span class="fill"
                  th:style="'width:' + ${battleView.monsterMaxHp > 0 ? (battleView.monsterCurrentHp * 100 / battleView.monsterMaxHp) : 0} + '%'"></span>
            <span class="bar-text"
                  th:text="${battleView.monsterCurrentHp} + ' / ' + ${battleView.monsterMaxHp}">25 / 25</span>
        </div>
    </div>

    <!-- 몬스터 전조 뱃지 & 실시간 게이지 영역 -->
    <div class="battle-stance-area" id="battleStanceArea">
        <!-- 1단계: 대치 페이즈 (시간 정지 ⏸️) -->
        <th:block th:if="${battleView.standby}">
            <div class="stance-badge badge-standby">⏸️ 대치 중 (정비 가능)</div>
            <button class="btn-clash-start" onclick="startClash()">⚔️ 공방 개시</button>
        </th:block>

        <!-- 2단계: 액티브 공방 페이즈 (1.0~1.5초 실시간 피지컬 ⚡) -->
        <th:block th:unless="${battleView.standby}">
            <div class="stance-badge"
                 th:classappend="${battleView.monsterStanceBadgeClass}"
                 th:text="${battleView.monsterStanceBadgeLabel}">💥 강공격 차징 중!</div>

            <!-- 실시간 카운트다운 게이지 -->
            <div class="clash-timer-wrap">
                <div class="clash-timer-bar"
                     id="clashTimerBar"
                     th:attr="data-duration=${battleView.clashDurationMs}"></div>
            </div>
        </th:block>
    </div>

    <!-- 이번 턴 전투 로그(중앙). 매 턴 교체, 누적 안 함 -->
    <div class="battle-log" id="battleLog">
        <div th:each="line : ${turnLog}" class="battle-log-line" th:text="${line}">로그</div>
    </div>

    <!-- 전투 스킬 버튼 영역 -->
    <div id="battleSkills"
         th:fragment="battle-skills"
         th:classappend="${battleView != null && battleView.standby ? 'disabled-skills' : ''}">
        <button th:each="skill : ${skills != null ? skills : battleView.skills}"
                th:attr="data-skill-id=${skill.id()},
                         data-skill-label=${skill.label()},
                         data-resource-kind=${skill.resourceKind()},
                         data-resource-cost=${skill.resourceCost()}"
                class="battle-skill-btn"
                th:classappend="${skill.type().name() == 'ULTIMATE'} ? (${skill.ultimateCooldown() > 0} ? ' ultimate-cooldown' : ' ultimate-ready') : ''"
                th:disabled="${(battleView != null && battleView.standby) || (skill.type().name() == 'ULTIMATE' && skill.ultimateCooldown() > 0)}"
                onclick="selectBattleSkill(this)">
            <span th:text="${skill.label()}">스킬</span>
            <span th:if="${skill.type().name() == 'ULTIMATE' && skill.ultimateCooldown() > 0}"
                  class="btn-cooldown-text"
                  th:text="' [🔒 (' + ${skill.ultimateCooldown()} + '승 남음)]'"> [🔒 (30승 남음)]</span>
            <span th:if="${skill.type().name() == 'ULTIMATE' && skill.ultimateCooldown() == 0}"
                  class="btn-ready-badge"> [⚡ (READY!)]</span>
        </button>
    </div>

    <!-- 도망 버튼 (대치 페이즈에서만 노출) -->
    <button th:if="${battleView.standby && battleView.fleeAvailable}"
            class="flee-btn"
            onclick="flee()">도망</button>

    <!-- 미니맵 -->
    <div th:replace="~{fragments/minimap :: minimap}"></div>
</div>

<!-- 전투 뷰 전체 프래그먼트: .center 교체용 (전투 시작 시 사용) -->
<section class="center battle-view" th:fragment="battle-view">
    <div th:replace="~{fragments/battle-view :: battle-center}"></div>
</section>

<!-- 전투 응답 프래그먼트: top-bar + battle-view + action-log 교체용 (턴/도망 결과) -->
<div th:fragment="battle-response">
    <header class="top-bar" id="topBar" th:replace="~{fragments/top-bar :: top-bar}"></header>

    <!-- 전투 종료 시: center 복원 -->
    <th:block th:if="${battleEnded}">
        <section class="center" id="center" th:replace="~{fragments/center :: center}"></section>
    </th:block>

    <!-- 전투 계속 시: battle-view 유지 -->
    <th:block th:unless="${battleEnded}">
        <section class="center battle-view" id="center">
            <div th:replace="~{fragments/battle-view :: battle-center}"></div>
        </section>
    </th:block>

    <footer class="action-log" id="actionLog" th:replace="~{fragments/action-log :: action-log}"></footer>

    <!-- 던전 클리어 보상 모달 -->
    <div th:replace="~{fragments/dungeon-clear-modal :: dungeon-clear-modal}"></div>

    <!-- 턴 결과 시그널 (JS에서 alert/battleActive 제어용) -->
    <div id="turnResultSignal" style="display:none"
         th:if="${turnResult != null}"
         th:attr="data-battle-ended=${turnResult.battleEnded()},
                  data-outcome=${turnResult.outcome()},
                  data-resource-insufficient=${turnResult.resourceInsufficient()},
                  data-insufficient-kind=${turnResult.insufficientKind()},
                  data-monster-name=${battleMonsterName},
                  data-dungeon-cleared=${dungeonClear != null}">
    </div>
</div>

</body>
</html>
