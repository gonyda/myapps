<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="overlay map-overlay" id="mapOverlay" th:fragment="full-map">
    <div class="map-popup">
        <header class="map-header">
            <h3>전체 지도</h3>
            <button class="panel-close" onclick="closeMap()" aria-label="닫기">✕</button>
        </header>
        <div class="map-legend">
            <span class="legend-item"><i class="dot type-town"></i>마을</span>
            <span class="legend-item"><i class="dot type-field"></i>자유필드</span>
            <span class="legend-item"><i class="dot type-dungeon"></i>던전</span>
        </div>
        <div class="map-body" id="mapViewport">
            <div class="map-canvas" id="mapCanvas">
                <div class="map-grid" id="mapGrid"
                     th:style="'grid-template-columns: repeat(' + ${view.fullMap.columns} + ', 52px); grid-template-rows: repeat(' + ${view.fullMap.rows} + ', 52px)'">
                    <div th:each="cell : ${view.fullMap.cells}"
                         th:style="'grid-column:' + ${cell.gridColumn} + '; grid-row:' + ${cell.gridRow}"
                         th:classappend="'node type-' + ${cell.type}
                             + (${cell.current} ? ' current' : '')
                             + (${cell.linkRight} ? ' link-right' : '')
                             + (${cell.linkDown} ? ' link-down' : '')">
                        <span class="node-label" th:text="${cell.name}">노드명</span>
                    </div>
                </div>
            </div>
            <div class="zoom-controls">
                <button onclick="mapZoom(1.25)" aria-label="확대">+</button>
                <button onclick="mapZoom(0.8)" aria-label="축소">−</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
