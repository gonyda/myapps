<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myrpg - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/myrpg.css}">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">⚔️ MYRPG</h1>
                <p class="login-subtitle">에린의 모험이 다시 시작됩니다</p>
            </div>

            <div th:if="${error}" class="login-error-banner" id="loginErrorBanner">
                <span class="error-icon">⚠️</span>
                <span class="error-text" th:text="${error}">아이디 또는 비밀번호가 일치하지 않습니다.</span>
            </div>

            <form th:action="@{/login}" method="post" class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">아이디</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="아이디를 입력하세요" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력하세요" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-login" id="btnLogin">⚔️ 게임 접속</button>
            </form>

            <div class="quick-login-section">
                <div class="quick-login-divider">
                    <span>빠른 테스트 로그인</span>
                </div>
                <div class="quick-login-buttons">
                    <button type="button" class="quick-login-btn quick-btn-bbsk" onclick="quickLogin('bbsk', '1')" id="btnQuickBbsk">
                        <span class="quick-icon">👤</span>
                        <span class="quick-label"><strong>bbsk</strong> (고니)</span>
                    </button>
                    <button type="button" class="quick-login-btn quick-btn-admin" onclick="quickLogin('admin', '1')" id="btnQuickAdmin">
                        <span class="quick-icon">👑</span>
                        <span class="quick-label"><strong>admin</strong> (전스킬+풀장비)</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/myrpg.js}"></script>
</body>
</html>
