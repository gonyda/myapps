<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 던전 탐색</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            padding: 1rem; line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100dvh - 2rem); }
        .header { text-align: center; padding: 0.5rem 0; border-bottom: 1px solid #333; margin-bottom: 1rem; }
        .header-title { font-size: 1.1rem; font-weight: bold; }
        .event-icon { font-size: 2rem; text-align: center; margin: 1rem 0; }
        .event-result {
            background: #16213e; border-radius: 8px; padding: 1rem;
            margin-bottom: 1rem; text-align: center; white-space: pre-line;
        }
        .actions { margin-top: auto; display: flex; flex-direction: column; gap: 0.8rem; padding-top: 1rem; }
        .btn-action {
            display: block; width: 100%; padding: 1rem;
            font-size: 1.1rem; font-weight: bold; text-align: center;
            border: 2px solid #333; border-radius: 8px;
            background: #16213e; color: #eee; cursor: pointer;
        }
        .btn-action:active { background: #0f3460; border-color: #e94560; }
        .btn-action.primary { border-color: #4ea8de; color: #4ea8de; }
        .btn-action.danger { border-color: #e94560; color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title"
                 th:text="|${explore.dungeonName()} ${explore.currentStage()}스테이지/${explore.totalStages()}|">
                광산 던전 3스테이지/5
            </div>
        </div>

        <div class="event-icon">
            <span th:if="${explore.eventType().name() == 'REST'}">💤</span>
            <span th:if="${explore.eventType().name() == 'TRAP'}">⚡</span>
            <span th:if="${explore.eventType().name() == 'TREASURE'}">🎁</span>
            <span th:if="${explore.eventType().name() == 'MERCHANT'}">🏪</span>
            <span th:if="${explore.eventType().name() == 'BATTLE'}">⚔️</span>
        </div>

        <div class="event-result" th:text="${explore.eventResult()}">
            갱도 구석에서 낡은 상자를 발견했다.
        </div>

        <div class="actions">
            <!-- Req 28.3: 스테이지 사이에 "다음 스테이지로" / "포기하고 마을로" -->
            <form th:action="@{/rpg/dungeon/next-stage}" method="post">
                <button type="submit" class="btn-action primary">다음 스테이지로 →</button>
            </form>
            <!-- Req 28.4: 보스 클리어 시 포기 버튼 미표시 -->
            <form th:if="${!explore.isBossStage() || !explore.bossDefeated()}"
                  th:action="@{/rpg/dungeon/abandon}" method="post">
                <button type="submit" class="btn-action danger">🚪 포기하고 마을로</button>
            </form>
        </div>
    </div>
</body>
</html>
