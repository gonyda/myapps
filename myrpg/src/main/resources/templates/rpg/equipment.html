<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 장비</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            padding: 1rem; line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .back-link { color: #4ea8de; text-decoration: none; font-size: 1rem; }
        .title { font-size: 1.2rem; font-weight: bold; }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab {
            flex: 1; text-align: center; padding: 0.6rem;
            border-radius: 6px; text-decoration: none; font-weight: bold;
            border: 2px solid #333; color: #aaa; background: #16213e;
        }
        .tab.active { border-color: #e94560; color: #eee; background: #0f3460; }
        .section-title { font-size: 0.95rem; color: #aaa; margin: 0.8rem 0 0.4rem; border-bottom: 1px solid #333; padding-bottom: 0.3rem; }
        .item-card {
            background: #16213e; border: 1px solid #333; border-radius: 8px;
            padding: 0.8rem; margin-bottom: 0.6rem;
        }
        .item-card.equipped { border-color: #e9c46a; }
        .item-name { font-weight: bold; }
        .item-grade { color: #e9c46a; font-size: 0.9rem; }
        .item-stat { color: #aaa; font-size: 0.9rem; }
        .item-actions { margin-top: 0.4rem; }
        .btn-small {
            display: inline-block; padding: 0.3rem 0.8rem; font-size: 0.9rem;
            border: 1px solid #e94560; border-radius: 4px;
            background: transparent; color: #e94560; cursor: pointer;
        }
        .btn-small:active { background: #e94560; color: #fff; }
        .empty-slot { color: #666; font-style: italic; }
        .skill-slot { display: inline-block; margin-right: 0.3rem; padding: 0.1rem 0.4rem; font-size: 0.85rem; background: #333; border-radius: 4px; }
        .skill-slot.empty { color: #666; }
        .skillbook-card {
            background: #16213e; border: 1px solid #333; border-radius: 8px;
            padding: 0.8rem; margin-bottom: 0.6rem;
        }
        .hint { color: #666; font-size: 0.85rem; margin-top: 0.3rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a class="back-link" th:href="@{/rpg/town}">← 마을</a>
            <span class="title">🎒 장비</span>
        </div>

        <div class="tabs">
            <a class="tab" th:classappend="${activeTab == 'armor'} ? ' active' : ''"
               th:href="@{/rpg/equipment}">🛡️ 방어구</a>
            <a class="tab" th:classappend="${activeTab == 'weapon'} ? ' active' : ''"
               th:href="@{/rpg/equipment/weapons}">⚔️ 무기</a>
        </div>

        <!-- ═══════ 방어구 탭 ═══════ -->
        <div th:if="${activeTab == 'armor'}">
            <div class="section-title">[ 착용중 ]</div>
            <div th:if="${equipment.equippedArmors().isEmpty()}" class="item-card">
                <span class="empty-slot">착용 중인 방어구가 없습니다</span>
            </div>
            <div th:each="armor : ${equipment.equippedArmors()}" class="item-card equipped">
                <div>
                    <span class="item-name" th:text="${armor.displayName}">강철 갑옷</span>
                    <span class="item-grade" th:text="|[${armor.grade}]|">[일반]</span>
                </div>
                <div class="item-stat" th:text="|${armor.armorSlot} · 방어+${armor.baseDefense}|">갑옷 · 방어+5</div>
                <div class="item-actions">
                    <form th:action="@{/rpg/equipment/equip-armor}" method="post" style="display:inline">
                        <input type="hidden" name="armorId" th:value="${armor.id}"/>
                        <button type="submit" class="btn-small">해제</button>
                    </form>
                </div>
            </div>

            <div class="section-title">[ 가방 - 방어구 ]</div>
            <div th:each="armor : ${equipment.armors()}" th:if="${!armor.equipped}" class="item-card">
                <div>
                    <span class="item-name" th:text="${armor.displayName}">낡은 장갑</span>
                    <span class="item-grade" th:text="|[${armor.grade}]|">[일반]</span>
                </div>
                <div class="item-stat" th:text="|${armor.armorSlot} · 방어+${armor.baseDefense}|">장갑 · 방어+3</div>
                <div class="item-actions">
                    <form th:action="@{/rpg/equipment/equip-armor}" method="post" style="display:inline">
                        <input type="hidden" name="armorId" th:value="${armor.id}"/>
                        <button type="submit" class="btn-small">착용</button>
                    </form>
                </div>
            </div>
            <p class="hint">* 터치하면 착용/해제</p>
        </div>

        <!-- ═══════ 무기 탭 ═══════ -->
        <div th:if="${activeTab == 'weapon'}">
            <div class="section-title">[ 착용중 ]</div>
            <div th:if="${equipment.equippedWeapon() == null}" class="item-card">
                <span class="empty-slot">착용 중인 무기가 없습니다</span>
            </div>
            <div th:if="${equipment.equippedWeapon() != null}" class="item-card equipped">
                <div>
                    <span class="item-name" th:text="${equipment.equippedWeapon().displayName}">화염의 지팡이</span>
                    <span class="item-grade" th:text="|[${equipment.equippedWeapon().grade}]|">[희귀]</span>
                </div>
                <div class="item-stat" th:text="|${equipment.equippedWeapon().weaponType} · 공격+${equipment.equippedWeapon().baseAttack}|">지팡이 · 공격+10</div>
                <div>
                    <th:block th:each="skill : ${equipment.weaponSkills()}"
                              th:if="${skill.weaponId == equipment.equippedWeapon().id}">
                        <span class="skill-slot" th:text="${#strings.abbreviate(skill.skillId + '', 8)}">스킬</span>
                    </th:block>
                    <span class="skill-slot empty"
                          th:if="${equipment.weaponSkills().isEmpty()}">⬜빈슬롯</span>
                </div>
            </div>

            <div class="section-title">[ 보유 무기 ]</div>
            <div th:each="weapon : ${equipment.weapons()}" th:if="${!weapon.equipped}" class="item-card">
                <div>
                    <span class="item-name" th:text="${weapon.displayName}">강철 검</span>
                    <span class="item-grade" th:text="|[${weapon.grade}]|">[고급]</span>
                </div>
                <div class="item-stat" th:text="|${weapon.weaponType} · 공격+${weapon.baseAttack} · 슬롯 ${weapon.skillSlots}|">검 · 공격+8 · 슬롯 2</div>
                <div class="item-actions">
                    <form th:action="@{/rpg/equipment/equip-weapon}" method="post" style="display:inline">
                        <input type="hidden" name="weaponId" th:value="${weapon.id}"/>
                        <button type="submit" class="btn-small">착용</button>
                    </form>
                </div>
            </div>

            <div class="section-title">[ 스킬북 ]</div>
            <div th:if="${equipment.skillBooks().isEmpty()}" class="item-card">
                <span class="empty-slot">보유한 스킬북이 없습니다</span>
            </div>
            <div th:each="book : ${equipment.skillBooks()}" class="skillbook-card">
                <div>
                    <span>📕</span>
                    <span class="item-name" th:text="${book.name()}">연속찌르기</span>
                    <span class="item-stat" th:text="|x${book.quantity()}|">x1</span>
                </div>
                <div class="item-actions" th:if="${equipment.equippedWeapon() != null}">
                    <form th:action="@{/rpg/equipment/attach-skill}" method="post" style="display:inline">
                        <input type="hidden" name="weaponId" th:value="${equipment.equippedWeapon().id}"/>
                        <input type="hidden" name="skillId" th:value="${book.skillId()}"/>
                        <button type="submit" class="btn-small">장착</button>
                    </form>
                </div>
            </div>
            <p class="hint">* 스킬북 터치 → 착용 무기에 장착</p>
        </div>
    </div>
</body>
</html>
