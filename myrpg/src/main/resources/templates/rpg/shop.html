<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 상점</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            padding: 1rem; line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
        .back-link { color: #4ea8de; text-decoration: none; font-size: 1rem; }
        .title { font-size: 1.2rem; font-weight: bold; }
        .gold-display { text-align: center; font-size: 1.1rem; margin-bottom: 1rem; color: #e9c46a; }
        .section-title { font-size: 0.95rem; color: #aaa; margin: 0.8rem 0 0.4rem; border-bottom: 1px solid #333; padding-bottom: 0.3rem; }
        .item-card {
            background: #16213e; border: 1px solid #333; border-radius: 8px;
            padding: 0.8rem; margin-bottom: 0.6rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .item-info { flex: 1; }
        .item-name { font-weight: bold; }
        .item-grade { color: #e9c46a; font-size: 0.9rem; }
        .item-price { color: #e9c46a; font-size: 0.95rem; }
        .btn-sell {
            padding: 0.4rem 0.8rem; font-size: 0.9rem;
            border: 1px solid #e9c46a; border-radius: 4px;
            background: transparent; color: #e9c46a; cursor: pointer;
        }
        .btn-sell:active { background: #e9c46a; color: #1a1a2e; }
        .btn-buy {
            padding: 0.4rem 0.8rem; font-size: 0.9rem;
            border: 1px solid #4ea8de; border-radius: 4px;
            background: transparent; color: #4ea8de; cursor: pointer;
        }
        .btn-buy:active { background: #4ea8de; color: #1a1a2e; }
        .potion-owned { font-size: 0.85rem; color: #aaa; }
        .empty-msg { color: #666; font-style: italic; padding: 0.5rem 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a class="back-link" th:href="@{/rpg/town}">← 마을</a>
            <span class="title">🏪 상점</span>
        </div>

        <div class="gold-display" th:text="|💰 ${shop.playerGold()} Gold|">💰 3,240 Gold</div>

        <!-- 판매 섹션 -->
        <div class="section-title">[ 💰 판매 - 무기 ]</div>
        <div th:if="${shop.sellableWeapons().isEmpty()}" class="empty-msg">판매할 무기가 없습니다</div>
        <div th:each="sw : ${shop.sellableWeapons()}" class="item-card">
            <div class="item-info">
                <span class="item-name" th:text="${sw.weapon().displayName}">낡은 검</span>
                <span class="item-grade" th:text="|[${sw.weapon().grade}]|">[일반]</span>
                <div class="item-price" th:text="|→ 판매가 ${sw.sellPrice()} G|">→ 판매가 100 G</div>
            </div>
            <form th:action="@{/rpg/shop/sell-weapon}" method="post">
                <input type="hidden" name="weaponId" th:value="${sw.weapon().id}"/>
                <button type="submit" class="btn-sell">판매</button>
            </form>
        </div>

        <div class="section-title">[ 💰 판매 - 방어구 ]</div>
        <div th:if="${shop.sellableArmors().isEmpty()}" class="empty-msg">판매할 방어구가 없습니다</div>
        <div th:each="sa : ${shop.sellableArmors()}" class="item-card">
            <div class="item-info">
                <span class="item-name" th:text="${sa.armor().displayName}">강철 갑옷</span>
                <span class="item-grade" th:text="|[${sa.armor().grade}]|">[희귀]</span>
                <div class="item-price" th:text="|→ 판매가 ${sa.sellPrice()} G|">→ 판매가 68 G</div>
            </div>
            <form th:action="@{/rpg/shop/sell-armor}" method="post">
                <input type="hidden" name="armorId" th:value="${sa.armor().id}"/>
                <button type="submit" class="btn-sell">판매</button>
            </form>
        </div>

        <!-- 구매 섹션 -->
        <div class="section-title">[ 🛒 구매 - 포션 ]</div>
        <div th:if="${shop.buyablePotions().isEmpty()}" class="empty-msg">구매할 포션이 없습니다</div>
        <div th:each="potion : ${shop.buyablePotions()}" class="item-card">
            <div class="item-info">
                <span class="item-name" th:text="${potion.name()}">HP 포션</span>
                <div class="item-price" th:text="|${potion.buyPrice()} G|">30 G</div>
                <span class="potion-owned" th:text="|보유: ${potion.owned()}개|">보유: 2개</span>
            </div>
            <form th:action="@{/rpg/shop/buy}" method="post">
                <input type="hidden" name="itemId" th:value="${potion.itemId()}"/>
                <button type="submit" class="btn-buy">구매</button>
            </form>
        </div>
    </div>
</body>
</html>
