<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 캐릭터 생성</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 1rem;
            line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; }
        h1 { text-align: center; font-size: 1.6rem; margin-bottom: 1.5rem; }
        .desc { text-align: center; color: #aaa; margin-bottom: 2rem; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        label { font-weight: bold; }
        input[type="text"] {
            width: 100%; padding: 0.8rem; font-size: 1.1rem;
            border: 2px solid #444; border-radius: 8px;
            background: #16213e; color: #eee;
        }
        input[type="text"]:focus { outline: none; border-color: #e94560; }
        .btn-submit {
            width: 100%; padding: 1rem; font-size: 1.2rem; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
            background: #e94560; color: #fff; margin-top: 0.5rem;
        }
        .btn-submit:active { background: #c23152; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ MyRPG</h1>
        <p class="desc">새로운 모험을 시작합니다.<br/>캐릭터 이름을 정해주세요.</p>
        <form th:action="@{/rpg/character/create}" method="post">
            <label for="name">캐릭터 이름</label>
            <input type="text" id="name" name="name" placeholder="이름 입력" required
                   maxlength="20" autocomplete="off"/>
            <button type="submit" class="btn-submit">🎮 모험 시작</button>
        </form>
    </div>
</body>
</html>
