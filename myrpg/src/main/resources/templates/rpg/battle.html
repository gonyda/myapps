<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 전투</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            padding: 1rem; line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100dvh - 2rem); }
        .monster-area { text-align: center; background: #16213e; border-radius: 8px; padding: 1rem; margin-bottom: 0.8rem; }
        .monster-name { font-size: 1.2rem; font-weight: bold; }
        .bar { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; justify-content: center; }
        .bar-track { width: 70%; height: 1rem; background: #333; border-radius: 4px; overflow: hidden; }
        .bar-fill-enemy { height: 100%; background: #ff6b6b; transition: width 0.3s; }
        .bar-fill-hp { height: 100%; background: #e94560; transition: width 0.3s; }
        .bar-fill-mp { height: 100%; background: #4ea8de; transition: width 0.3s; }
        .bar-text { font-size: 0.85rem; color: #aaa; }
        .player-area { background: #16213e; border-radius: 8px; padding: 0.8rem; margin-bottom: 0.8rem; }
        .player-bar { display: flex; align-items: center; gap: 0.5rem; margin: 0.2rem 0; }
        .player-bar .label { width: 2rem; font-weight: bold; font-size: 0.95rem; }
        .player-bar .bar-track { flex: 1; }
        .player-bar .bar-text { min-width: 5rem; text-align: right; }
        .turn-info { text-align: center; color: #e9c46a; font-size: 0.95rem; margin-bottom: 0.5rem; }
        .actions { margin-top: auto; display: flex; flex-direction: column; gap: 0.6rem; padding-top: 0.5rem; }
        .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .btn-action {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 0.8rem 0.4rem; font-size: 1rem; font-weight: bold;
            border: 2px solid #333; border-radius: 8px;
            background: #16213e; color: #eee; cursor: pointer;
        }
        .btn-action:active { background: #0f3460; border-color: #e94560; }
        .btn-action .cost { font-size: 0.8rem; color: #4ea8de; font-weight: normal; }
        .btn-flee {
            display: block; width: 100%; padding: 0.8rem;
            font-size: 1rem; font-weight: bold; text-align: center;
            border: 2px solid #e94560; border-radius: 8px;
            background: transparent; color: #e94560; cursor: pointer;
        }
        .btn-flee:active { background: #e94560; color: #fff; }
        .potion-section { margin-top: 0.4rem; }
        .potion-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-potion {
            padding: 0.5rem 0.8rem; font-size: 0.9rem;
            border: 1px solid #4ea8de; border-radius: 6px;
            background: transparent; color: #4ea8de; cursor: pointer;
        }
        .btn-potion:active { background: #4ea8de; color: #fff; }
        .section-label { font-size: 0.85rem; color: #aaa; margin-bottom: 0.3rem; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 몬스터 영역 -->
        <div class="monster-area">
            <div class="monster-name" th:text="${battle.battleSession().monsterName}">동굴 박쥐</div>
            <div class="bar">
                <span class="bar-text">HP</span>
                <div class="bar-track">
                    <div class="bar-fill-enemy"
                         th:style="|width: ${battle.battleSession().monsterMaxHp > 0 ? (battle.battleSession().monsterCurrentHp * 100 / battle.battleSession().monsterMaxHp) : 0}%|"></div>
                </div>
                <span class="bar-text"
                      th:text="|${battle.battleSession().monsterCurrentHp}/${battle.battleSession().monsterMaxHp}|">35/100</span>
            </div>
        </div>

        <!-- 플레이어 영역 -->
        <div class="player-area">
            <div class="player-bar">
                <span class="label">HP</span>
                <div class="bar-track">
                    <div class="bar-fill-hp"
                         th:style="|width: ${battle.battleSession().playerMaxHp > 0 ? (battle.battleSession().playerCurrentHp * 100 / battle.battleSession().playerMaxHp) : 0}%|"></div>
                </div>
                <span class="bar-text"
                      th:text="|${battle.battleSession().playerCurrentHp}/${battle.battleSession().playerMaxHp}|">65/150</span>
            </div>
            <div class="player-bar">
                <span class="label">MP</span>
                <div class="bar-track">
                    <div class="bar-fill-mp"
                         th:style="|width: ${battle.battleSession().playerMaxHp > 0 ? (battle.battleSession().playerCurrentMp * 100 / battle.battleSession().playerMaxHp) : 0}%|"></div>
                </div>
                <span class="bar-text"
                      th:text="|${battle.battleSession().playerCurrentMp}|">50</span>
            </div>
        </div>

        <!-- 턴 정보 -->
        <div class="turn-info"
             th:text="|Turn ${battle.battleSession().turnCount} · ${battle.battleSession().playerTurn ? '당신의 차례' : '몬스터 차례'}|">
            Turn 1 · 당신의 차례
        </div>

        <!-- Req 28.6: 기본 공격, 장착 스킬, 아이템 사용, 도망 -->
        <div class="actions">
            <!-- 기본 공격 + 스킬 -->
            <div class="action-row">
                <form th:action="@{/rpg/battle/attack}" method="post">
                    <button type="submit" class="btn-action" style="width:100%">⚔️ 기본공격</button>
                </form>
                <th:block th:each="skill : ${battle.playerSkills()}">
                    <form th:action="@{/rpg/battle/skill}" method="post">
                        <input type="hidden" name="skillId" th:value="${skill.skillId()}"/>
                        <button type="submit" class="btn-action" style="width:100%">
                            <span th:text="${skill.name()}">파이어볼</span>
                            <span class="cost" th:text="|MP ${skill.mpCost()}|">MP 20</span>
                        </button>
                    </form>
                </th:block>
            </div>

            <!-- 포션 -->
            <div class="potion-section" th:if="${!battle.playerPotions().isEmpty()}">
                <div class="section-label">🎒 아이템</div>
                <div class="potion-row">
                    <th:block th:each="potion : ${battle.playerPotions()}">
                        <form th:action="@{/rpg/battle/item}" method="post" style="display:inline">
                            <input type="hidden" name="itemId" th:value="${potion.itemId()}"/>
                            <button type="submit" class="btn-potion"
                                    th:text="|${potion.isHp() ? '❤️' : '💧'} ${potion.name()} x${potion.quantity()}|">
                                ❤️ HP포션 x3
                            </button>
                        </form>
                    </th:block>
                </div>
            </div>

            <!-- 도망 -->
            <form th:action="@{/rpg/battle/flee}" method="post">
                <button type="submit" class="btn-flee">🏃 도망</button>
            </form>
        </div>
    </div>
</body>
</html>
