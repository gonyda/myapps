<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 마을</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            padding: 1rem; line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; }
        .header { text-align: center; padding: 0.5rem 0; border-bottom: 1px solid #333; margin-bottom: 1rem; }
        .header h1 { font-size: 1.4rem; }
        .status { background: #16213e; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .status .name { font-size: 1.2rem; font-weight: bold; }
        .bar { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
        .bar-label { width: 2rem; font-weight: bold; }
        .bar-track { flex: 1; height: 1.2rem; background: #333; border-radius: 4px; overflow: hidden; }
        .bar-fill-hp { height: 100%; background: #e94560; transition: width 0.3s; }
        .bar-fill-mp { height: 100%; background: #4ea8de; transition: width 0.3s; }
        .bar-text { font-size: 0.85rem; color: #aaa; min-width: 5rem; text-align: right; }
        .gold { font-size: 1.1rem; margin-top: 0.3rem; }
        .message { text-align: center; color: #aaa; margin: 1rem 0; }
        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-top: auto; padding-top: 1rem; }
        .nav-btn {
            display: flex; align-items: center; justify-content: center;
            padding: 1rem; font-size: 1.1rem; font-weight: bold;
            border: 2px solid #333; border-radius: 8px;
            background: #16213e; color: #eee; text-decoration: none;
            cursor: pointer;
        }
        .nav-btn:active { background: #0f3460; border-color: #e94560; }
        .active-run { text-align: center; color: #e9c46a; margin-bottom: 0.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚔️ MyRPG</h1>
        </div>

        <div class="status">
            <div class="name" th:text="|Lv.${town.playerLevel()} ${town.playerName()}|">Lv.1 모험가</div>
            <div class="bar">
                <span class="bar-label">HP</span>
                <div class="bar-track">
                    <div class="bar-fill-hp" th:style="|width: ${town.maxHp() > 0 ? (town.hp() * 100 / town.maxHp()) : 0}%|"></div>
                </div>
                <span class="bar-text" th:text="|${town.hp()}/${town.maxHp()}|">100/100</span>
            </div>
            <div class="bar">
                <span class="bar-label">MP</span>
                <div class="bar-track">
                    <div class="bar-fill-mp" th:style="|width: ${town.maxMp() > 0 ? (town.mp() * 100 / town.maxMp()) : 0}%|"></div>
                </div>
                <span class="bar-text" th:text="|${town.mp()}/${town.maxMp()}|">50/50</span>
            </div>
            <div class="gold" th:text="|💰 ${town.gold()} Gold|">💰 0 Gold</div>
        </div>

        <div class="active-run" th:if="${town.hasActiveRun()}">⚠️ 진행 중인 던전이 있습니다</div>

        <div class="message">마을에 도착했다.<br/>어디로 갈까?</div>

        <div class="nav-grid">
            <a class="nav-btn" th:href="${town.hasActiveRun()} ? @{/rpg/dungeon/explore} : @{/rpg/dungeon/select}">🏔️ 던전</a>
            <a class="nav-btn" th:href="@{/rpg/equipment}">🎒 장비</a>
            <a class="nav-btn" th:href="@{/rpg/shop}">🏪 상점</a>
            <a class="nav-btn" href="#">👤 정보</a>
        </div>
    </div>
</body>
</html>
