<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 던전 선택</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            padding: 1rem; line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .back-link { color: #4ea8de; text-decoration: none; font-size: 1rem; }
        .title { font-size: 1.2rem; font-weight: bold; }
        .dungeon-card {
            background: #16213e; border: 2px solid #333; border-radius: 8px;
            padding: 1rem; margin-bottom: 1rem;
        }
        .dungeon-name { font-size: 1.1rem; font-weight: bold; }
        .dungeon-info { color: #aaa; font-size: 0.95rem; margin: 0.3rem 0; }
        .dungeon-stars { color: #e9c46a; }
        .btn-enter {
            display: block; width: 100%; padding: 0.7rem; margin-top: 0.5rem;
            font-size: 1rem; font-weight: bold; text-align: center;
            border: 2px solid #e94560; border-radius: 6px;
            background: transparent; color: #e94560; cursor: pointer;
        }
        .btn-enter:active { background: #e94560; color: #fff; }
        .player-level { color: #aaa; font-size: 0.9rem; text-align: center; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a class="back-link" th:href="@{/rpg/town}">← 마을</a>
            <span class="title">🏔️ 던전 선택</span>
        </div>

        <div class="player-level" th:text="|현재 레벨: Lv.${dungeonSelect.playerLevel()}|">현재 레벨: Lv.1</div>

        <div th:each="dungeon : ${dungeonSelect.dungeons()}" class="dungeon-card">
            <div class="dungeon-name" th:text="${dungeon.name()}">숲 던전</div>
            <div class="dungeon-info">
                <span>난이도: </span>
                <span class="dungeon-stars">
                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                        <span th:if="${i <= dungeon.difficulty()}">★</span>
                        <span th:if="${i > dungeon.difficulty()}">☆</span>
                    </th:block>
                </span>
            </div>
            <div class="dungeon-info" th:text="|5스테이지 | 권장 Lv.${dungeon.requiredLevel()}|">5스테이지 | 권장 Lv.1</div>
            <form th:action="@{/rpg/dungeon/enter}" method="post">
                <input type="hidden" name="dungeonId" th:value="${dungeon.id()}"/>
                <button type="submit" class="btn-enter">⚔️ 입장</button>
            </form>
        </div>
    </div>
</body>
</html>
