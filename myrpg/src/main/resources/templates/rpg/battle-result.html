<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <title>⚔️ MyRPG - 전투 승리</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e; color: #eee;
            min-height: 100dvh; display: flex; flex-direction: column;
            padding: 1rem; line-height: 1.8; font-size: 1.1rem;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100dvh - 2rem); }
        .victory-title { text-align: center; font-size: 1.4rem; font-weight: bold; margin-bottom: 0.5rem; color: #e9c46a; }
        .monster-defeated { text-align: center; color: #aaa; margin-bottom: 1rem; }
        .result-card {
            background: #16213e; border: 1px solid #333; border-radius: 8px;
            padding: 1rem; margin-bottom: 0.8rem;
        }
        .result-title { font-weight: bold; margin-bottom: 0.3rem; }
        .result-row { display: flex; justify-content: space-between; }
        .result-value { color: #4ea8de; }
        .drop-card {
            background: #16213e; border: 1px solid #e9c46a; border-radius: 8px;
            padding: 1rem; margin-bottom: 0.8rem;
        }
        .drop-title { font-weight: bold; color: #e9c46a; margin-bottom: 0.3rem; }
        .drop-desc { color: #eee; }
        .levelup-card {
            background: #0f3460; border: 1px solid #4ea8de; border-radius: 8px;
            padding: 1rem; margin-bottom: 0.8rem; text-align: center;
        }
        .levelup-title { font-weight: bold; color: #4ea8de; font-size: 1.1rem; }
        .cleared-card {
            background: #1a4d2e; border: 1px solid #2ecc71; border-radius: 8px;
            padding: 1rem; margin-bottom: 0.8rem; text-align: center; color: #2ecc71;
            font-weight: bold; font-size: 1.1rem;
        }
        .actions { margin-top: auto; display: flex; flex-direction: column; gap: 0.8rem; padding-top: 1rem; }
        .btn-action {
            display: block; width: 100%; padding: 1rem;
            font-size: 1.1rem; font-weight: bold; text-align: center;
            border: 2px solid #333; border-radius: 8px;
            background: #16213e; color: #eee; cursor: pointer;
        }
        .btn-action:active { background: #0f3460; border-color: #e94560; }
        .btn-action.primary { border-color: #4ea8de; color: #4ea8de; }
        .btn-action.danger { border-color: #e94560; color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <div class="victory-title">🎉 전투 승리!</div>
        <div class="monster-defeated" th:text="|${result.monsterName()}을(를) 처치했다!|">동굴 박쥐를 처치했다!</div>

        <!-- 보상 정보 -->
        <div class="result-card">
            <div class="result-title">📊 결과</div>
            <div class="result-row">
                <span>경험치</span>
                <span class="result-value" th:text="|+${result.expGained()}|">+48</span>
            </div>
            <div class="result-row">
                <span>골드</span>
                <span class="result-value" th:text="|+${result.goldGained()}|">+22</span>
            </div>
        </div>

        <!-- 레벨업 -->
        <div class="levelup-card" th:if="${result.levelUpResult() != null}">
            <div class="levelup-title"
                 th:text="|🎊 레벨업! Lv.${result.levelUpResult().newLevel()}|">🎊 레벨업! Lv.2</div>
        </div>

        <!-- 드랍 아이템 -->
        <div class="drop-card" th:if="${result.dropResult() != null && result.dropResult().category().name() != 'NONE'}">
            <div class="drop-title">🎁 드랍 아이템</div>
            <div class="drop-desc" th:text="${result.dropDescription()}">낡은 장갑 [일반]</div>
        </div>

        <!-- 던전 클리어 -->
        <div class="cleared-card" th:if="${result.dungeonCleared()}">
            🏆 던전 클리어! 마을로 복귀합니다.
        </div>

        <!-- 행동 버튼 -->
        <div class="actions">
            <!-- Req 28.4: 보스 승리(dungeonCleared)면 포기 버튼 미표시, 자동 마을 복귀 -->
            <form th:action="@{/rpg/battle/claim-reward}" method="post">
                <button type="submit" class="btn-action primary"
                        th:text="${result.dungeonCleared()} ? '🏠 마을로 돌아가기' : '다음 스테이지로 →'">
                    다음 스테이지로 →
                </button>
            </form>
            <form th:if="${!result.dungeonCleared()}"
                  th:action="@{/rpg/dungeon/abandon}" method="post">
                <button type="submit" class="btn-action danger">🚪 포기하고 마을로</button>
            </form>
        </div>
    </div>
</body>
</html>
