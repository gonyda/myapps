<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>myrpg</title>
    <link rel="stylesheet" th:href="@{/css/myrpg.css}">
</head>
<body>
    <div class="phone">
        <!-- 상단 바 -->
        <div th:replace="~{fragments/top-bar :: top-bar}"></div>

        <div class="main">
            <!-- 왼쪽 사이드바 -->
            <div th:replace="~{fragments/left-sidebar :: left-sidebar}"></div>

            <!-- 가운데 영역 -->
            <th:block th:if="${battleView != null}">
                <section class="center battle-view" id="center">
                    <!-- 몬스터 정보 -->
                    <div class="battle-monster-info">
                        <span class="monster-name" th:text="${battleView.monsterName}">몬스터</span>
                        <span class="monster-level" th:text="'Lv.' + ${battleView.monsterLevel}">Lv.1</span>
                    </div>
                    <!-- 몬스터 HP 바 -->
                    <div class="battle-hp-wrap">
                        <span class="label">HP</span>
                        <div class="bar monster-hp">
                            <span class="fill"
                                  th:style="'width:' + ${battleView.monsterMaxHp > 0 ? (battleView.monsterCurrentHp * 100 / battleView.monsterMaxHp) : 0} + '%'"></span>
                            <span class="bar-text"
                                  th:text="${battleView.monsterCurrentHp} + ' / ' + ${battleView.monsterMaxHp}">25 / 25</span>
                        </div>
                    </div>
                    <!-- 전투 스킬 버튼 영역 -->
                    <div id="battleSkills">
                        <button th:each="skill : ${skills}"
                                th:text="${skill.label()}"
                                th:attr="data-skill-id=${skill.id()},
                                         data-skill-label=${skill.label()}"
                                class="battle-skill-btn"
                                onclick="battleTurn(this.getAttribute('data-skill-id'), this.getAttribute('data-skill-label'))">
                            스킬
                        </button>
                    </div>
                    <!-- 도망 버튼 -->
                    <button th:if="${battleView.fleeAvailable}"
                            class="flee-btn"
                            onclick="flee()">도망</button>
                    <!-- 미니맵 -->
                    <div th:replace="~{fragments/minimap :: minimap}"></div>
                </section>
            </th:block>
            <th:block th:if="${battleView == null}">
                <div th:replace="~{fragments/center :: center}"></div>
            </th:block>
        </div>

        <!-- 하단 행동 로그 -->
        <div th:replace="~{fragments/action-log :: action-log}"></div>

        <!-- 이동 패드 (우하단 고정 오버레이) -->
        <div th:replace="~{fragments/move-pad :: move-pad}"></div>
    </div>

    <!-- 전체화면 팝업 (장비/인벤토리/스킬/정보 공용) -->
    <div th:replace="~{fragments/panel-popup :: panel-popup}"></div>

    <!-- 정보 팝업 (캐릭터 상세 정보) -->
    <div th:replace="~{fragments/info-popup :: info-popup}"></div>

    <!-- 재능 선택 팝업 (환생 2단계) -->
    <div th:replace="~{fragments/talent-select :: talent-select}"></div>

    <!-- 전체 맵 팝업 -->
    <div th:replace="~{fragments/full-map :: full-map}"></div>

    <!-- 인벤토리 팝업 -->
    <div th:replace="~{fragments/inventory-popup :: inventory-popup}"></div>

    <!-- 아이템 상세 모달 (인벤토리·은행 공용, 목록 위에 뜨는 별도 오버레이) -->
    <div th:replace="~{fragments/item-detail :: item-detail}"></div>

    <!-- 스킬 팝업 (목록 + 승급 모달) -->
    <div class="overlay" id="skillOverlay">
        <div class="panel">
            <header class="panel-header">
                <h3>스킬</h3>
                <button class="panel-close" onclick="closeSkillPopup()" aria-label="닫기">✕</button>
            </header>
            <div class="panel-body" id="skillPanelBody">
                <!-- 스킬 목록 (탭 + 행) -->
                <div id="skillListArea"></div>
            </div>
        </div>
    </div>

    <!-- 스킬 승급 모달 (목록 위에 뜨는 별도 오버레이) -->
    <div class="overlay rankup-overlay" id="rankupOverlay">
        <div class="rankup-modal-panel">
            <div id="rankupModalArea"></div>
        </div>
    </div>

    <!-- 은행 팝업 -->
    <div th:replace="~{fragments/bank-popup :: bank-popup}"></div>

    <script th:src="@{/js/myrpg.js}"></script>
    <div id="battleActiveSignal" th:if="${battleActive}" style="display:none"></div>
</body>
</html>
